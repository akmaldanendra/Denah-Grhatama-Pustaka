<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Peta interaktif gedung Grhatama Pustaka – Balai Layanan Perpustakaan DPAD DIY. Temukan lokasi ruangan di 3 lantai dengan mudah.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C62828">

  <!-- Open Graph (preview saat link dibagikan di WA/sosmed) -->
  <meta property="og:title" content="Peta Interaktif Grhatama Pustaka">
  <meta property="og:description" content="Temukan lokasi ruangan di Grhatama Pustaka dengan peta interaktif 3 lantai.">
  <meta property="og:type" content="website">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grhatama Pustaka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Peta Interaktif Grhatama Pustaka</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #C62828;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: white;
      text-align: center;
      padding: 24px;
    }

    #loading-screen svg {
      width: 64px;
      height: 64px;
      opacity: 0.9;
    }

    #loading-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    #loading-subtitle {
      font-size: 13px;
      opacity: 0.7;
      line-height: 1.5;
    }

    #loading-bar-wrap {
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* Flutter canvas — sembunyikan sampai siap */
    flt-glass-pane { opacity: 0; transition: opacity 0.4s ease; }
    flt-glass-pane.ready { opacity: 1; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <!-- Ikon gedung sederhana (inline SVG, zero network request) -->
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="20" width="48" height="36" rx="2" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
      <rect x="16" y="28" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
      <rect x="28" y="28" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
      <rect x="40" y="28" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
      <rect x="16" y="42" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
      <rect x="40" y="42" width="8" height="8" rx="1" fill="white" opacity="0.8"/>
      <rect x="26" y="42" width="12" height="14" rx="1" fill="white"/>
      <polyline points="4,22 32,6 60,22" stroke="white" stroke-width="2" stroke-linejoin="round" fill="none"/>
    </svg>

    <div>
      <div id="loading-title">Grhatama Pustaka</div>
      <div id="loading-subtitle">Balai Layanan Perpustakaan<br>DPAD DIY</div>
    </div>

    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
  </div>

  <script>
    // Animasi loading bar selama Flutter engine loading
    const bar = document.getElementById('loading-bar');
    let progress = 0;
    const interval = setInterval(() => {
      // Maju cepat sampai 85%, lalu tunggu Flutter ready
      const step = progress < 50 ? 3 : progress < 75 ? 1.5 : 0.5;
      progress = Math.min(progress + step, 85);
      bar.style.width = progress + '%';
    }, 80);

    // Flutter initialization hook
    window.addEventListener('flutter-first-frame', () => {
      clearInterval(interval);
      bar.style.width = '100%';
      setTimeout(() => {
        const loadingEl = document.getElementById('loading-screen');
        if (loadingEl) {
          loadingEl.style.transition = 'opacity 0.3s ease';
          loadingEl.style.opacity = '0';
          setTimeout(() => loadingEl.remove(), 350);
        }
        const canvas = document.querySelector('flt-glass-pane');
        if (canvas) canvas.classList.add('ready');
      }, 200);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
